<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pipeworks">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Pipeworks</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Used only to read the device safe-area insets from JS */
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  /* ---------- Courier mail overlay ---------- */
  #mail { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2.5vh; background: rgba(6, 8, 22, 0.78); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    font-family: ui-rounded, system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: manipulation; }
  #mail[hidden] { display: none !important; }
  #mail .env { --w: min(280px, 64vh, 70vw); position: relative; width: var(--w); height: calc(var(--w) * 0.6);
    margin-top: calc(var(--w) * 0.48); perspective: 700px; }
  #mail .env.drop { animation: envDrop 0.65s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes envDrop { from { transform: translateY(-110vh) rotate(-12deg); } to { transform: none; } }
  #mail .back { position: absolute; inset: 0; background: #c9b48a; border-radius: 7px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #mail .letter { position: absolute; left: 6%; right: 6%; top: 7%; height: calc(var(--w) * 0.51); z-index: 2;
    background: #fffdf4; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.25); text-align: center;
    padding: calc(var(--w) * 0.035) 6%; box-sizing: border-box; transition: transform 0.8s cubic-bezier(.25, 1.5, .45, 1); }
  #mail .reveal .letter { transform: translateY(calc(var(--w) * -0.5)); }
  #mail .kicker { font-size: calc(var(--w) * 0.05); letter-spacing: .18em; font-weight: 800; color: #8a4ac8; }
  #mail .msg { margin: calc(var(--w) * 0.025) 0 calc(var(--w) * 0.04); font-size: calc(var(--w) * 0.062); font-weight: 700; color: #2a2238; line-height: 1.18; }
  #mail .front { position: absolute; inset: 0; z-index: 3; background: #e9d7ae; border-radius: 7px;
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
  #mail .flap { position: absolute; left: 0; right: 0; top: 0; height: 60%; z-index: 4; background: #dcc597;
    clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center;
    transition: transform 0.5s ease-in, z-index 0s linear 0.25s; }
  #mail .open .flap { transform: rotateX(180deg); z-index: 1; }
  #mail .seal { position: absolute; left: 50%; top: 46%; z-index: 5; width: calc(var(--w) * 0.14); height: calc(var(--w) * 0.14);
    margin-left: calc(var(--w) * -0.07); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff6a6a, #b01e2e);
    box-shadow: 0 2px 4px rgba(0,0,0,.35); transition: opacity .2s, transform .3s; color: #ffd6d6; font-weight: 900;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--w) * 0.07); }
  #mail .open .seal { opacity: 0; transform: scale(1.6); }
  #mail .close { z-index: 6; border: 0; border-radius: 999px; padding: 1.6vh 5vh; font: 800 max(13px, 3.4vh) ui-rounded, system-ui, sans-serif;
    background: #2a4a96; color: #fff; box-shadow: 0 3px 0 #1a3268; opacity: 0; transition: opacity .4s .9s; }
  #mail .close.on { opacity: 1; }
  #mail .cf { position: absolute; top: -4vh; width: 8px; height: 13px; border-radius: 2px; z-index: 7; pointer-events: none;
    animation: cfFall linear forwards; }
  @keyframes cfFall { to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="mail" hidden>
  <div class="env">
    <div class="back"></div>
    <div class="letter">
      <div class="kicker">SPECIAL DELIVERY</div>
      <div class="msg"></div>
    </div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">P</div>
  </div>
  <button class="close" type="button">Back to work &#9654;</button>
</div>
<script>
'use strict';
/* =====================================================================
   PIPEWORKS v0.3.0 — original bump-and-kick single-screen platformer
   v0.3: phase schedule, Pincer crabs, coin drops, bonus coin round,
         Jolt block (3-use shockwave), 1-up at 20,000
   ===================================================================== */
const VERSION = '0.12.0';
// Arcade CRTs showed 256x224 on a 4:3 tube, so pixels were ~7:6 wide. ?square for square pixels.
const PIXEL_ASPECT = /[?&]square/.test(location.search) ? 1 : 7 / 6;
const W = 256, H = 224;
const DEBUG = /[?&]debug/.test(location.search);
// DEV (temporary, for vibing): starting phase picker on the title screen. URL ?phase=N still works.
const PHASE_PICK_MAX = 30;
let startPhase = 1;
try { startPhase = parseInt(localStorage.getItem('pipeworks.startPhase') || '1', 10) || 1; } catch (e) {}
{ const m = location.search.match(/[?&]phase=(\d+)/); if (m) startPhase = parseInt(m[1], 10) || 1; }
startPhase = Math.max(1, Math.min(PHASE_PICK_MAX, startPhase));
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 1; // iPadOS fix

// ---------- Tuning (also live in console as TUNE) ----------
// ===================== COURIER MAIL — edit these to configure the envelope =====================
const MAIL = {
  enabled: true,
  // The prize link was removed in v0.10.2; the real reward delivery will be designed separately.
  message: "You caught the mail! Nice catch.",
  points: 1000,                                // bonus for catching the pigeon
  fromPhase: 1,                                // first phase it can appear in
  chance: 0.5,                                 // odds it shows up in a given (non-bonus) phase
  earliest: 10, latest: 30,                    // seconds into the phase it can arrive
  oncePerGame: false,                          // true = only one delivery per game
  speed: 0.7, passes: 2,                       // flight speed (px/frame) and screen crossings before it leaves
};
// ?mailtest = the pigeon comes every phase, 4 seconds in (for trying it out)
const MAIL_TEST = /[?&]mailtest/.test(location.search);

const TUNE = {
  runMax: 1.35, runAccel: 0.10, skidDecel: 0.20, friction: 0.15, airAccel: 0.02,   // v0.4.2: less slippery (was skid 0.14, friction 0.10)
  gravity: 0.22, jumpVel: 5.3, maxFall: 4.5,   // ~64px rise: comfortable one-tier climbs, still 8px short of two
  coyote: 6, jumpBuffer: 7, supportMin: 4,
  bonkVy: 0,         // no extra downward kick after a head bonk: keeps hang time for low-ceiling hops
  landAssist: 3,     // px: a jump that just catches a ledge with a toe gets nudged on
  bumpFrames: 18, bumpAmp: 6, bumpHalfWidth: 14,
  bumpReach: 13,
  snapSpeeds: [0.42, 0.70, 1.00],    // Snapper: calm, mad, furious
  pincSpeeds: [0.55, 0.88, 1.15],    // Pincer: a bit quicker
  angryBoost: 1.4,                   // speed multiplier after a Pincer's first bump (any color)
  critterMax: 1.25,                  // no critter ever outruns the worker (runMax 1.35)
  gnatSpeeds: [0.65, 0.85, 1.05],    // Gnat: sideways speed during a hop
  gnatWait: [28, 20, 14],            // frames a Gnat rests on the girder between hops (bump it now!)
  gnatHopVy: 2.6, gnatGrav: 0.14,    // ~24px hops
  flyScale: 1.3,                     // HD fly drawn 30% larger
  // Ice (v0.9.0)
  slugFrom: 9, slugFirst: 8, slugEvery: 16, slugMax: 2,   // Frost Slugs: from Phase 9; seconds
  slugSpeed: 0.45, slugFreezeTime: 75,                    // frames it spends icing a girder (bump it!)
  iceFriction: 0.035, iceSkid: 0.05, iceAccel: 0.06,      // worker physics on ice (normal: 0.15 / 0.20 / 0.10); ~26px coast
  icicleFrom: 16, icicleFirst: 10, icicleEvery: 8, icicleMax: 2,
  icyBonusFrom: 8,                                        // bonus rounds from Phase 8 have iced girders
  // Sparks (fireballs). Seconds into a phase; each new spark comes a bit sooner (the longer you dawdle,
  // the more sparks). "Hot" phases (12-14, 19-21...) run all spark timers at 60%.
  sparkRedFrom: 1, sparkRedFirst: 22, sparkRedEvery: 28, sparkRedEarly: 10,   // red can also come early when a critter drains into a bottom pipe
  sparkGreenFrom: 4, sparkGreenFirst: 30, sparkGreenEvery: 22,
  sparkSpeedUp: 3, sparkMinGap: 12, sparkRedLife: 20, sparkMaxEach: 2,
  humRed: 0.10, humGreen: 0.07,       // spark drone volume (0 = off)
  phaseSpeedUp: 0.04,
  flipTime: 540,
  spawnGap: 150,
  pipeReturn: 60,
  invuln: 150,
  liftTime: 300,
  coinSpeed: 0.8,
  bonusTime: [20, 15],               // seconds: first bonus round, later ones
  extraLifeAt: 20000,
  stunTime: 50, stunVy: 2.4,          // 2P: bumped from below by the other worker (frames dazed, pop-up speed)
};
window.TUNE = TUNE;

// ---------- Palette ----------
const C = {
  girder: '#3e5fa8', girderHi: '#86a8ff', girderLo: '#24386e', girderSeam: '#1b2a52', rivet: '#c9d8ff',
  brick: '#8c3a1c', brickHi: '#c25a2a', mortar: '#2a0f05',
  pipe: '#c8753a', pipeHi: '#f2ad6c', pipeLo: '#7a3e17', pipeMouth: '#140700',
  hud: '#ffffff', hudP1: '#ff9a1f', hudP2: '#bfe4ff', hudTop: '#ff6a5a',
  coin: '#ffd23f', coinLo: '#b8860b', coinHi: '#fff6c0',
  jolt: '#2c3550', joltEdge: '#9fb3e8', bolt: '#ffe14a',
};

// ---------- Canvas & layout ----------
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');   // 'let': HD burnt effect briefly draws into an offscreen canvas
const view = { scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0, portrait: false, rightX0: 0 };
const safe = { t: 0, r: 0, b: 0, l: 0 };
const buttons = {};

function readSafe() {
  const s = getComputedStyle(document.getElementById('safe'));
  safe.t = parseFloat(s.paddingTop) || 0;  safe.r = parseFloat(s.paddingRight) || 0;
  safe.b = parseFloat(s.paddingBottom) || 0; safe.l = parseFloat(s.paddingLeft) || 0;
}
function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 3);
  view.cw = window.innerWidth; view.ch = window.innerHeight;
  cvs.width = Math.round(view.cw * view.dpr);
  cvs.height = Math.round(view.ch * view.dpr);
  readSafe();
  view.portrait = isTouch && view.ch > view.cw;
  // Tablets get a wider LEFT gutter so the joystick can be bigger; the jump side stays as is.
  view.tablet = isTouch && Math.min(view.cw, view.ch) >= 600;
  const gL = isTouch ? (view.tablet ? 170 : 100) : 0, gR = isTouch ? 100 : 0;
  const availW = view.cw - safe.l - safe.r - gL - gR;
  const availH = view.ch - safe.t;            // floor bricks may sit under the home indicator
  view.sy = Math.max(0.5, Math.min(availH / H, availW / (W * PIXEL_ASPECT)));
  view.sx = view.sy * PIXEL_ASPECT;
  view.gw = W * view.sx; view.gh = H * view.sy;
  view.ox = safe.l + gL + (availW - view.gw) / 2;
  view.oy = safe.t + (availH - view.gh) / 2;
  layoutButtons();
}
function layoutButtons() {
  const { cw, ch } = view;
  const lx0 = safe.l, lw = view.ox - lx0;
  const rx0 = view.ox + view.gw, rw = cw - safe.r - rx0;
  view.rightX0 = rx0;
  const jr = Math.max(30, Math.min(rw * 0.36, 52));                         // jump: unchanged sizing
  const sr = view.tablet ? Math.max(30, Math.min(lw * 0.36, 68)) : Math.max(30, Math.min(lw * 0.36, 52));
  const travel = view.tablet ? Math.max(22, Math.min(lw * 0.30, 54)) : Math.max(22, Math.min(lw * 0.26, 36));
  const cy = ch - safe.b - jr - Math.max(24, ch * 0.12);
  buttons.stick = { cx: lx0 + lw / 2, cy, r: sr, travel };
  buttons.jump = { cx: rx0 + rw / 2, cy, r: jr };
}

// ---------- Input ----------
const input = { left: false, right: false, jumpHeld: false, jumpPressed: false };    // Player 1
const input2 = { left: false, right: false, jumpHeld: false, jumpPressed: false };   // Player 2
// 2-player co-op (v0.12.0): chosen on the title screen, saved; ?players=2 / ?players=1 override
let twoP = false;
try { twoP = localStorage.getItem('pipeworks.players') === '2'; } catch (e) {}
{ const m = location.search.match(/[?&]players=([12])/); if (m) twoP = m[1] === '2'; }
const keys = {};
const touches = new Map();
let startTap = false;

function zoneFor(x) {
  if (x < view.ox) return 'stick';
  if (x > view.rightX0) return 'jump';
  return 'game';
}
// Fixed stick: the base never moves. Direction = thumb position relative to its center.
const STICK_DEAD = 8;
// Phones: the stick quietly re-centers behind the thumb once it's pushed past STICK_PHONE_REACH, so
// stopping (pull back ~reach-dead) and reversing (~reach+dead) are always short moves. The drawn base
// never moves. Tablets keep the plain fixed stick.
const STICK_PHONE_REACH = 18, STICK_PHONE_DEAD = 7;
const stickDead = () => (view.tablet ? STICK_DEAD : STICK_PHONE_DEAD);
function stickFollow(t) {
  if (view.tablet || t.zone !== 'stick') return;
  const dx = t.x - t.ax;
  if (Math.abs(dx) > STICK_PHONE_REACH) t.ax = t.x - Math.sign(dx) * STICK_PHONE_REACH;
}
function onTouch(e) {
  e.preventDefault();
  unlockAudio();
  for (const t of e.changedTouches) {
    if (e.type === 'touchstart') {
      PAD.lastUsed = -1e9;                         // touching the screen: show touch controls again
      const zone = zoneFor(t.clientX);
      if (zone === 'game' && inHDChip(t.clientX, t.clientY)) { toggleHD(); continue; }
      if (zone === 'game' && inChip(PLAYERS_CHIP, t.clientX, t.clientY)) { togglePlayers(); continue; }
      { const ph = zone === 'game' ? phaseChipHit(t.clientX, t.clientY) : null;
        if (ph !== null) { if (ph) setStartPhase(startPhase + ph); continue; } }
      const nt = { x: t.clientX, y: t.clientY, zone, ax: buttons.stick.cx };
      stickFollow(nt);
      touches.set(t.identifier, nt);
      if (zone === 'jump') input.jumpPressed = true;
      startTap = true;
    } else if (e.type === 'touchmove') {
      const o = touches.get(t.identifier);
      if (o) { o.x = t.clientX; o.y = t.clientY; stickFollow(o); }
    } else {
      touches.delete(t.identifier);
    }
  }
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
  cvs.addEventListener(ev, onTouch, { passive: false });
}
cvs.addEventListener('mousedown', e => { unlockAudio();
  const ph = phaseChipHit(e.clientX, e.clientY);
  if (inHDChip(e.clientX, e.clientY)) toggleHD(); else if (inChip(PLAYERS_CHIP, e.clientX, e.clientY)) togglePlayers(); else if (ph !== null) { if (ph) setStartPhase(startPhase + ph); } else startTap = true; });
document.addEventListener('contextmenu', e => e.preventDefault());

const JUMP_KEYS = ['Space', 'KeyZ', 'ArrowUp', 'KeyW', 'KeyX'];
// 2-player keyboard split: P1 = arrows + Space/Up/'/', P2 = A D + W/Z/X
const P1_JUMP_KEYS = ['Space', 'ArrowUp', 'Slash'], P2_JUMP_KEYS = ['KeyW', 'KeyZ', 'KeyX'];
window.addEventListener('keydown', e => {
  unlockAudio();
  if (!e.repeat) {
    if (!twoP) { if (JUMP_KEYS.includes(e.code)) input.jumpPressed = true; }
    else if (P1_JUMP_KEYS.includes(e.code)) input.jumpPressed = true;
    else if (P2_JUMP_KEYS.includes(e.code)) input2.jumpPressed = true;
  }
  if (e.code === 'Enter' || e.code === 'Space') startTap = true;
  if (e.code === 'KeyH' && !e.repeat && state === 'title') toggleHD();
  if (state === 'title' && (e.code === 'Digit1' || e.code === 'Digit2') && twoP !== (e.code === 'Digit2')) togglePlayers();
  if (state === 'title' && (e.code === 'BracketLeft' || e.code === 'Minus')) setStartPhase(startPhase - 1);
  if (state === 'title' && (e.code === 'BracketRight' || e.code === 'Equal')) setStartPhase(startPhase + 1);
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- Game controller (PS5 DualSense, Xbox, MFi...) via the Gamepad API, "standard" mapping ----------
// Move: left stick or d-pad.  Jump: Cross (X) or Circle.  Start / Back to work: Cross or Options.
// Title screen: L1 / R1 = starting phase, Triangle = art style.
// 1 player: every controller drives Player 1. 2 players: PAD.slot[n] = the gamepad index that drives player n.
// A lone controller goes to Player 2 (Player 1 uses touch or keyboard); with two, the first is P1, the second P2.
const PAD = { dead: 0.35, prev: [], lastUsed: -1e9, slot: [null, null] };
function assignPads(idx) {
  for (const s of [0, 1]) if (PAD.slot[s] !== null && !idx.includes(PAD.slot[s])) PAD.slot[s] = null;   // unplugged
  for (const i of idx) {
    if (PAD.slot.includes(i)) continue;
    if (PAD.slot[1] === null && (idx.length === 1 || PAD.slot[0] !== null)) PAD.slot[1] = i;
    else if (PAD.slot[0] === null) PAD.slot[0] = i;
  }
}
function readPad() {
  const blank = () => ({ left: false, right: false, jump: false, pressed: new Set() });
  const out = [blank(), blank()], menu = new Set();      // per player, plus any-pad presses for menus
  const pads = [...(navigator.getGamepads ? navigator.getGamepads() || [] : [])].filter(g => g && g.connected);
  assignPads(pads.map(g => g.index));
  for (const g of pads) {
    const owner = !twoP ? 0 : PAD.slot.indexOf(g.index);
    const o = out[owner] || blank();                     // an unassigned 3rd pad still works the menus
    const btn = i => !!(g.buttons[i] && g.buttons[i].pressed);
    const ax = g.axes[0] || 0;
    if (ax < -PAD.dead || btn(14)) o.left = true;
    if (ax > PAD.dead || btn(15)) o.right = true;
    if (btn(0) || btn(1)) o.jump = true;
    const prev = PAD.prev[g.index] || [];
    g.buttons.forEach((b, i) => { if (b.pressed && !prev[i]) { o.pressed.add(i); menu.add(i); } });
    PAD.prev[g.index] = g.buttons.map(b => b.pressed);
    if (o.left || o.right || o.jump || o.pressed.size || Math.abs(ax) > PAD.dead) PAD.lastUsed = frameCount;
  }
  return { out, menu };
}
const padActive = () => frameCount - PAD.lastUsed < 60 * 20;   // used in the last 20s: hide the touch controls
// Touch controls show unless a controller is in use, except in 2P when no controller belongs to Player 1
const showTouch = () => isTouch && (!padActive() || (twoP && PAD.slot[0] === null));
window.addEventListener('gamepadconnected', () => { PAD.lastUsed = frameCount; });

function pollInput() {
  const pad = readPad();
  if (pad.menu.size) {
    unlockAudio();
    const P = i => pad.menu.has(i);
    if (state === 'title') {
      if (P(4)) setStartPhase(startPhase - 1);
      if (P(5)) setStartPhase(startPhase + 1);
      if (P(3)) toggleHD();
      if (P(2)) togglePlayers();                       // Square: 1 or 2 players
      if (P(0) || P(9)) startTap = true;
    } else if (state === 'mail') {
      if (P(0) || P(9)) closeMail();
    } else if (state === 'gameover') {
      if (P(0) || P(9)) startTap = true;
    } else if (state === 'play') {
      [input, input2].forEach((inp, n) => { const q = pad.out[n].pressed; if (q.has(0) || q.has(1)) inp.jumpPressed = true; });
    }
  }
  let tl = pad.out[0].left, tr = pad.out[0].right, tj = pad.out[0].jump;
  for (const t of touches.values()) {                  // touch controls always drive Player 1
    if (t.zone === 'stick') {
      const dx = t.x - t.ax;
      if (dx < -stickDead()) tl = true; else if (dx > stickDead()) tr = true;
    } else if (t.zone === 'jump') tj = true;
  }
  if (!twoP) {
    input.left = tl || !!keys.ArrowLeft || !!keys.KeyA;
    input.right = tr || !!keys.ArrowRight || !!keys.KeyD;
    input.jumpHeld = tj || JUMP_KEYS.some(k => keys[k]);
  } else {
    input.left = tl || !!keys.ArrowLeft;
    input.right = tr || !!keys.ArrowRight;
    input.jumpHeld = tj || P1_JUMP_KEYS.some(k => keys[k]);
    const p2 = pad.out[1];
    input2.left = p2.left || !!keys.KeyA;
    input2.right = p2.right || !!keys.KeyD;
    input2.jumpHeld = p2.jump || P2_JUMP_KEYS.some(k => keys[k]);
  }
}

// ---------- Audio ----------
let actx = null, master = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state !== 'running') actx.resume();
  } catch (e) { /* audio optional */ }
}
const audioOK = () => actx && actx.state === 'running';
// --- Chip voices: NES-style pulse waves (12.5% / 25% / 50% duty) built from Fourier series
const WAVES = {};
function pulseWave(duty) {
  const key = 'p' + duty;
  if (WAVES[key]) return WAVES[key];
  const n = 48, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
  return (WAVES[key] = actx.createPeriodicWave(re, im));
}
function setWave(o, type) {

// Jump "scoop": a slide-whistle swoop — dips a touch, then curves up faster and faster.

function scoop() {

  const o = actx.createOscillator(), o2 = actx.createOscillator(), lp = actx.createBiquadFilter();

    osc.frequency.linearRampToValueAtTime(205 * k * m, t + 0.035);          // the little dip
    osc.frequency.exponentialRampToValueAtTime(780 * k * m, t + 0.21);      // ...then scoop up

  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.27);

  o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(master);

function squeakOnce(p, at) {
  const t = actx.currentTime + at, k = 0.95 + Math.random() * 0.1;     // each squeak a little different
  const o = actx.createOscillator(), lp = actx.createBiquadFilter(), g = actx.createGain();
  o.type = p.wave;
  o.frequency.setValueAtTime(p.pts[0][1] * k, t);
  for (let i = 1; i < p.pts.length; i++) o.frequency.linearRampToValueAtTime(p.pts[i][1] * k, t + p.pts[i][0]);
  if (p.wob[1] > 0) {
    const lfo = actx.createOscillator(), depth = actx.createGain();
    lfo.frequency.value = p.wob[0]; depth.gain.value = p.wob[1];
    lfo.connect(depth); depth.connect(o.frequency); lfo.start(t); lfo.stop(t + p.end + 0.02);
  }
  lp.type = 'lowpass'; lp.frequency.value = p.lp; lp.Q.value = 0.5;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(p.vol, t + p.att);
  g.gain.setValueAtTime(p.vol, t + p.hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + p.end);
  o.connect(lp); lp.connect(g); g.connect(master);
  o.start(t); o.stop(t + p.end + 0.02);

}

const hum = { red: null, green: null, on: { red: 0, green: 0 } };
function makeHumVoice(freq, throb, filterHz) {
  const o = actx.createOscillator(), o2 = actx.createOscillator();
  o.type = 'sawtooth'; o.frequency.value = freq;
  o2.type = 'sawtooth'; o2.frequency.value = freq * 1.007;            // slight detune = thicker, beating drone
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filterHz; lp.Q.value = 2;
  const trem = actx.createGain(); trem.gain.value = 0.7;
  const lfo = actx.createOscillator(), lfoAmt = actx.createGain();
  lfo.frequency.value = throb; lfoAmt.gain.value = 0.3;              // throb: gain swings 0.4..1.0
  lfo.connect(lfoAmt); lfoAmt.connect(trem.gain);
  const out = actx.createGain(); out.gain.value = 0;
  o.connect(lp); o2.connect(lp); lp.connect(trem); trem.connect(out); out.connect(master);
  o.start(); o2.start(); lfo.start();

}

      hum.on[k] = want[k];

}

// ---------- Sprites ----------
function makeSprite(rows, pal, withFlip = false) {
  const h = rows.length, w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) console.warn('sprite row', i, 'len', r.length, r); });
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }
  const mk = (sx, sy) => {
    const f = document.createElement('canvas'); f.width = w; f.height = h;
    const fg = f.getContext('2d');
    fg.translate(sx < 0 ? w : 0, sy < 0 ? h : 0); fg.scale(sx, sy); fg.drawImage(c, 0, 0);
    return f;
  };
  const s = { r: c, l: mk(-1, 1), w, h };
  if (withFlip) { s.fr = mk(1, -1); s.fl = mk(-1, -1); }
  return s;
}

// ---------- Helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapX = x => ((x % W) + W) % W;
const wrapDx = (from, to) => { let d = to - from; if (d > W / 2) d -= W; if (d < -W / 2) d += W; return d; };
const OFFS = [-W, 0, W];
function overlapX(p, pl) {
  let best = 0;
  for (const off of OFFS) {
    const a = Math.max(p.x - p.w / 2 + off, pl.x);
    const b = Math.min(p.x + p.w / 2 + off, pl.x + pl.w);
    if (b - a > best) best = b - a;
  }
  return best;
}
const playerOnly = pl => pl.temp || pl.jolt;
function supported(e, min) {
  for (const pl of level.plats) {
    if (playerOnly(pl) && !e.isPlayer) continue;
    if (Math.abs(pl.y - e.y) < 0.5 && overlapX(e, pl) >= min) return true;
  }
  return false;
}
// Ledge assist: if the worker lands with only a toe on the girder, slide him on far enough to stand.
function snapOnto(p, pl, min) {
  if (overlapX(p, pl) >= min) return;
  for (const off of OFFS) {
    const l = p.x - p.w / 2 + off, r = p.x + p.w / 2 + off;
    if (r <= pl.x || l >= pl.x + pl.w) continue;
    const onLeftEdge = (r - pl.x) < (pl.x + pl.w - l);
    p.x = wrapX(p.x + (onLeftEdge ? min - (r - pl.x) : -(min - (pl.x + pl.w - l))));
    return;
  }
}
function findLanding(e, oldBot, min, fromAbove = false) {
  let land = null;
  for (const pl of level.plats) {
    if (playerOnly(pl) && !e.isPlayer) continue;
    if ((fromAbove ? oldBot < pl.y - 0.01 : oldBot <= pl.y + 0.01) && e.y >= pl.y && overlapX(e, pl) >= min) {
      if (!land || pl.y < land.y) land = pl;
    }
  }
  return land;
}
function touching(a, b, shrink) {
  return Math.abs(wrapDx(a.x, b.x)) < (a.w + b.w) / 2 - shrink &&
         a.y - a.h < b.y - shrink && b.y - b.h < a.y - shrink;
}

// ---------- Phase schedule ----------
// Mirrors the arcade's pacing: turtles, bonus, crabs, mix. Gnats/frost slugs come later.
const isBonus = n => n === 3 || (n >= 8 && (n - 8) % 7 === 0);
function phaseRoster(n) {
  if (n === 1) return ['snap', 'snap', 'snap'];
  if (n === 2) return Array(6).fill('snap');
  if (n === 4) return Array(4).fill('pinc');
  if (n === 5) return ['pinc', 'snap', 'pinc', 'snap', 'pinc', 'snap'];
  if (n === 6) return ['gnat', 'gnat', 'gnat', 'gnat'];
  if (n === 7) return ['gnat', 'pinc', 'gnat', 'pinc', 'gnat'];
  // 9+: repeating 3-phase cycle (skipping bonus rounds): gnats+snappers, gnats+pincers, gnats+pincers
  let idx = 0;
  for (let k = 9; k < n; k++) if (!isBonus(k)) idx++;
  const other = idx % 3 === 0 ? 'snap' : 'pinc';
  const count = Math.min(5 + Math.floor(idx / 3), 6);
  return Array.from({ length: count }, (_, i) => (i === 1 || i === 4 ? 'gnat' : other));
}
// Phases 12-14, 19-21, ...: fireballs come more often (arcade pattern)
function sparksHot(n) { let idx = 0; for (let k = 9; k < n; k++) if (!isBonus(k)) idx++; return n >= 9 && Math.floor(idx / 3) % 2 === 1; }
const phaseSubtitle = n => ({
  1: 'Bump them over, then kick them off',
  2: 'More snappers on the way',
  4: 'Pincers take two bumps',
  5: 'Pincers and snappers together',
  6: 'Gnats hop: bump them as they land',
  7: 'Gnats and pincers',
  9: 'Frost slugs! Bump them before they ice a girder',
  16: 'Icicles! Watch the ceiling',
}[n] || (phaseRoster(n).includes('snap') ? 'Gnats and snappers' : 'Gnats and pincers'));

function startGame() {
  state = 'play';
  for (const p of players) {
    removeLift(p);
    Object.assign(p, { inGame: p.id === 0 || twoP, out: false, score: 0, lives: 3, extraGiven: false, stun: 0,
                       x: twoP ? (p.id ? 152 : 104) : 128, y: FLOOR_Y, vx: 0, vy: 0, face: p.id ? -1 : 1, onGround: true,
                       coyote: 0, jumpBuf: 0, dead: false, invuln: 0 });

  setJoltHits(3);

}

function beginPhase(n, gameStart = false) {
  phase = n; clearT = 0; bonus = null;
  enemies.length = 0; spawnQueue.length = 0; coins.length = 0;
  bumps.length = 0; particles.length = 0; popups.length = 0; smoke.length = 0;
  resetSparkTimers();
  hazardsOff = false;
  scheduleMail(n);
  icicles.length = 0; slugClock = 0; nextSlug = TUNE.slugFirst * 60;
  icicleClock = 0; nextIcicle = TUNE.icicleFirst * 60;
  const icyBonus = isBonus(n) && n >= TUNE.icyBonusFrom;
  for (const pl of level.plats) {                   // everything thaws each phase (icy bonus rounds start frozen)
    const iceable = !pl.floor && !pl.jolt && !pl.temp;
    pl.iced = icyBonus && iceable; pl.iceT = pl.iced ? 1 : 0;
  }
  if (isBonus(n)) {
    const first = n === 3;
    bonus = { t: (first ? TUNE.bonusTime[0] : TUNE.bonusTime[1]) * 60 + 60, got: 0,
              total: BONUS_SPOTS.length, first };
    for (const [x, y] of BONUS_SPOTS) coins.push({ x, y, w: 8, h: 8, fixed: true, spin: Math.random() * 4 });
    showBanner('BONUS ROUND', icyBonus ? `Icy girders! Grab all ${BONUS_SPOTS.length} coins` : `Grab all ${BONUS_SPOTS.length} coins`, 120);
    if (!gameStart) sfx.bonus();
    return;
  }
  phaseRoster(n).forEach((kind, i) => {
    spawnQueue.push({ kind, side: i % 2 ? 1 : -1, delay: 90 + i * TUNE.spawnGap, level: 0 });
  });
  showBanner('PHASE ' + n, phaseSubtitle(n));

}
function showBanner(a, b, t = 150) { bannerLines = [a, b]; banner = t; }

// ---------- Player ----------
function updatePlayer(p) {
  const T = TUNE, input = p.input;
  const dazed = p.stun > 0;                          // bumped by the other worker: no control for a moment
  if (dazed) p.stun--;
  const dir = dazed ? 0 : (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (p.invuln > 0) p.invuln--;

  if (dazed) p.jumpBuf = 0;
  else if (input.jumpPressed) p.jumpBuf = T.jumpBuffer;
  else if (p.jumpBuf > 0) p.jumpBuf--;

  const wasSkid = p.skid;
  p.skid = false;
  const ice = p.onGround && onIce(p);                 // iced girder: slow to start, slow to stop
  const accel = ice ? T.iceAccel : T.runAccel, skidK = ice ? T.iceSkid : T.skidDecel, fric = ice ? T.iceFriction : T.friction;
  if (p.onGround) {
    if (dir !== 0) {
      if (p.vx * dir < 0 && Math.abs(p.vx) > 0.35) { p.vx += dir * skidK; p.skid = true; if (!wasSkid) sfx.squeak(); }
      else p.vx += dir * accel;
      p.face = dir;
    } else {
      if (Math.abs(p.vx) <= fric) p.vx = 0; else p.vx -= Math.sign(p.vx) * fric;
    }
  } else if (dir !== 0) {
    p.vx += dir * T.airAccel;
  }
  p.vx = clamp(p.vx, -T.runMax, T.runMax);

  if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)) {
    p.vy = -T.jumpVel; p.onGround = false; p.coyote = 0; p.jumpBuf = 0;
    sfx.jump();
  }

  p.x += p.vx;
  resolveX(p);
  p.x = wrapX(p.x);

  if (p.onGround) {
    if (!supported(p, T.supportMin)) { p.onGround = false; p.coyote = T.coyote; p.vy = 0; }
  } else {
    if (p.coyote > 0) p.coyote--;
    p.vy = Math.min(p.vy + T.gravity, T.maxFall);
    const oldTop = p.y - p.h, oldBot = p.y;
    p.y += p.vy;
    if (p.vy < 0) checkHead(p, oldTop);
    else {
      // Normal landing, else (only when dropping onto a ledge from above) the ledge assist
      const land = findLanding(p, oldBot, T.supportMin) ||
                   (T.landAssist > 0 ? findLanding(p, oldBot, Math.max(1, T.supportMin - T.landAssist), true) : null);
      if (land) { snapOnto(p, land, T.supportMin); p.y = land.y; p.vy = 0; p.onGround = true; sfx.land(); }
    }
  }

  if (p.onGround && Math.abs(p.vx) > 0.05) {
    p.anim += Math.abs(p.vx) * 0.11;
    const step = Math.floor(p.anim);
    if (step !== p.lastStep) { p.lastStep = step; sfx.step(step & 1); }
  }
}

function resolveX(p) {
  const top = p.y - p.h, bot = p.y;
  for (const pl of level.plats) {
    if (pl.temp) continue;
    if (!(bot > pl.y + 0.01 && top < pl.y + pl.h - 0.01)) continue;
    for (const off of OFFS) {
      const l = p.x - p.w / 2 + off, r = p.x + p.w / 2 + off;
      if (r > pl.x && l < pl.x + pl.w) {
        const pushL = r - pl.x, pushR = pl.x + pl.w - l;
        if (pushL < pushR) { p.x -= pushL; if (p.vx > 0) p.vx = 0; }
        else               { p.x += pushR; if (p.vx < 0) p.vx = 0; }
      }
    }
  }
}

function checkHead(p, oldTop) {
  const top = p.y - p.h;
  let hit = null, best = 0;
  for (const pl of level.plats) {
    if (pl.floor || pl.temp) continue;
    const b = pl.y + pl.h;
    if (oldTop >= b - 0.01 && top < b) {
      const ov = overlapX(p, pl);
      if (ov > best) { best = ov; hit = pl; }
    }
  }
  if (!hit) return;
  p.y = hit.y + hit.h + p.h;
  p.vy = TUNE.bonkVy;
  if (hit.jolt) { triggerJolt(p); return; }
  let bx = p.x, bestD = Infinity;
  for (const off of OFFS) {
    const cx = clamp(p.x + off, hit.x, hit.x + hit.w);
    const d = Math.abs(cx - (p.x + off));
    if (d < bestD) { bestD = d; bx = cx; }
  }
  triggerBump(hit, bx, p);
}

// ---------- 2 players: bumping and shoving each other ----------
// A bump under the other worker pops him up, dazed (no control) for TUNE.stunTime frames. Never deadly.
function stunPlayer(q, bx) {
  q.onGround = false; q.vy = -TUNE.stunVy; q.coyote = 0; q.jumpBuf = 0;
  q.vx = (wrapDx(bx, q.x) >= 0 ? 1 : -1) * 0.6;
  q.stun = TUNE.stunTime;
  sfx.stunned();
}
// Workers are solid side to side: walking into the other one pushes him (each moves half the overlap).
function separatePlayers() {
  const [a, b] = alivePlayers();
  if (!b) return;
  const dx = wrapDx(a.x, b.x);
  const ov = (a.w + b.w) / 2 - Math.abs(dx);
  const vOv = Math.min(a.y, b.y) - Math.max(a.y - a.h, b.y - b.h);   // vertical overlap of the bodies
  if (ov <= 0 || vOv < 6) return;                                     // passing over/under each other is fine
  const s = dx >= 0 ? 1 : -1;
  a.x = wrapX(a.x - s * ov / 2); b.x = wrapX(b.x + s * ov / 2);
  resolveX(a); resolveX(b);
  a.x = wrapX(a.x); b.x = wrapX(b.x);
}

function onIce(p) {
  for (const pl of level.plats) if (pl.iced && Math.abs(pl.y - p.y) < 0.5 && overlapX(p, pl) >= TUNE.supportMin) return true;
  return false;
}

// ---------- Death & respawn ----------
const smoke = [];   // soft puffs (burnt worker); drawn as circles in HD, squares in pixel mode
// Returns true when this death wiped the sparks/icicles (only once nobody is left standing, so in
// 2P a death doesn't hand the survivor a free hazard clear).
function killPlayer(p, cause = 'critter') {
  p.dead = true; p.deathT = 0; p.vx = 0; p.vy = 0; p.deathCause = cause; p.stun = 0;
  p.lives--;
  removeLift(p);
  const wipe = alivePlayers().length === 0;
  if (wipe) { sparks.length = 0; icicles.length = 0; }
  if (cause === 'spark') {
    sfx.burn();
    for (let k = 0; k < 14; k++) particles.push({ x: p.x + Math.random() * 10 - 5, y: p.y - Math.random() * 16,
      vx: Math.random() * 2.4 - 1.2, vy: -Math.random() * 2, life: 16 + Math.random() * 12, color: k % 2 ? '#ffb040' : '#ff5a1a' });
  } else sfx.die();
  return wipe;
}
const BURN_HOLD = 64;   // frames the crispy worker stands there before dropping
function updateDeath(p) {
  p.deathT++;
  if (p.deathCause === 'spark') {
    if (p.deathT <= BURN_HOLD) {
      if (p.deathT % 4 === 0) smoke.push({ x: p.x + Math.random() * 8 - 4, y: p.y - 14 - Math.random() * 4,
        vx: Math.random() * 0.3 - 0.15, vy: -0.35 - Math.random() * 0.25, r: 1.5 + Math.random(), life: 50, max: 50 });
      if (p.deathT === 34) sfx.die();
    } else {
      p.vy = Math.min(p.vy + 0.16, 4); p.y += p.vy;                    // no hop: straight down
      if (p.deathT % 3 === 0) particles.push({ x: p.x + Math.random() * 8 - 4, y: p.y - 4, vx: Math.random() * 0.4 - 0.2,
        vy: -0.2, life: 22, color: Math.random() < 0.3 ? '#ff8a30' : '#3a332e' });   // ash + embers
    }
  } else {
    if (p.deathT === 45) p.vy = -3.2;
    if (p.deathT > 45) { p.vy += 0.18; p.y += p.vy; }
  }
  if (p.deathT > 60 && p.y - p.h > H + 10) {
    if (p.lives > 0) respawn(p);
    else { p.out = true; if (!inPlay().length) gameOver(); }   // 2P: the other worker plays on
  }
}
function respawn(p) {
  const x = spawnX(p);
  Object.assign(p, { x, y: 40, vx: 0, vy: 0, face: p.id && twoP ? -1 : 1, onGround: true, coyote: 0,
                     jumpBuf: 0, dead: false, stun: 0, invuln: TUNE.invuln });
  p.lift = { x: x - 8, y: 40, w: 16, h: 4, temp: true, t: TUNE.liftTime };
  level.plats.push(p.lift);
}
function removeLift(p) {
  if (!p.lift) return;
  const i = level.plats.indexOf(p.lift);
  if (i >= 0) level.plats.splice(i, 1);
  p.lift = null;
}
function updateLift(p) {
  if (!p.lift) return;
  if (--p.lift.t <= 0 || p.input.left || p.input.right || !p.onGround) removeLift(p);
}
function gameOver() {
  state = 'gameover'; stateT = 240;
  const score = hiScore();
  if (score > topScore) {
    topScore = score;
    try { localStorage.setItem('pipeworks.top', String(topScore)); } catch (e) {}
  }

}

// ---------- Critters ----------
function critterSpeed(e) {
  const v = KIND[e.kind].speeds()[e.level] * (e.angry ? TUNE.angryBoost : 1) * (1 + TUNE.phaseSpeedUp * (phase - 1));
  return Math.min(v, TUNE.critterMax);
}
function spawnCritter(kind, side, lvl, angry = false) {
  const k = KIND[kind];
  enemies.push({
    kind, x: side < 0 ? 8 : W - 8, y: TOP_Y, w: k.w, h: k.h, vx: 0, vy: 0,
    dir: side < 0 ? 1 : -1, state: 'walk', onGround: true, angry,
    level: lvl, flipT: 0, anim: 0, turnCool: 0, hopT: 20,
  });
  sfx.spawn();
}
function updateSpawns() {
  for (let i = spawnQueue.length - 1; i >= 0; i--) {
    if (--spawnQueue[i].delay <= 0) {
      const q = spawnQueue.splice(i, 1)[0];
      spawnCritter(q.kind, q.side, q.level, !!q.angry);
    }
  }
}

// One hit from a girder bump or the Jolt block.
function hitCritter(e, bx, p) {                   // p = the worker who bumped (gets the points)
  if (e.state === 'kicked' || e.state === 'poof') return;
  if (e.kind === 'slug') { poofSlug(e, true, p); return; }   // arcade: vanishes instead of flipping
  e.onGround = false;
  if (e.state === 'flipped') {                     // hit again: back on its feet
    e.state = 'walk'; e.vx = 0; e.vy = -2.2;
    sfx.unflip();
    return;
  }
  if (e.kind === 'pinc' && !e.angry) {             // first hit just makes a Pincer mad
    e.angry = true; e.vx = 0; e.vy = -1.6;
    sfx.anger();
    return;
  }
  e.state = 'flipped'; e.angry = false; e.vy = -2.2;
  e.flipT = Math.max(240, TUNE.flipTime - (phase - 1) * 30);
  e.vx = (wrapDx(bx, e.x) >= 0 ? 1 : -1) * 0.4;
  addScore(10, e.x, e.y - 12, p);
  sfx.flip();
}

// Phase won: every hazard on screen fizzles out, and no new ones come this phase.
let hazardsOff = false;
function clearHazards() {
  if (hazardsOff) return;
  hazardsOff = true;
  let any = false;
  for (const s of sparks) { any = true;
    for (let k = 0; k < 10; k++) particles.push({ x: s.x, y: s.y, vx: Math.random() * 2.2 - 1.1, vy: -Math.random() * 1.8,
      life: 14 + Math.random() * 12, color: s.kind === 'red' ? (k % 2 ? '#ffb040' : '#ffffff') : (k % 2 ? '#9dff8a' : '#ffffff') }); }
  for (const ic of icicles) { any = true;
    for (let k = 0; k < 6; k++) particles.push({ x: ic.x, y: ic.y + ic.len / 2, vx: Math.random() * 1.6 - 0.8, vy: -Math.random() * 1.2,
      life: 12 + Math.random() * 8, color: k % 2 ? '#e8fbff' : '#a8e4f8' }); }
  for (const e of enemies) if (e.kind === 'slug' && e.state !== 'poof') { any = true; poofSlug(e, false); }
  sparks.length = 0; icicles.length = 0;
  for (let i = spawnQueue.length - 1; i >= 0; i--) if (spawnQueue[i].kind === 'slug') spawnQueue.splice(i, 1);
  if (any) sfx.sparkOut();
}

function kickCritter(e, p) {
  e.state = 'kicked';
  const d = wrapDx(p.x, e.x);
  const dir = d === 0 ? p.face : Math.sign(d);
  e.vx = dir * 1.8; e.vy = -2.6; e.onGround = false;
  addScore(800, e.x, e.y - 12, p);
  sfx.kick();
  if (targetsLeft(true) > 0) spawnCoin();
  else clearHazards();                             // last one: sparks, icicles and slugs fizzle out
}

// Frost Slugs are never phase targets (arcade rule), so they don't count here.
function targetsLeft(excludeKicked) {
  return enemies.filter(e => e.kind !== 'slug' && e.state !== 'poof' && (!excludeKicked || e.state !== 'kicked')).length +
         spawnQueue.filter(q => q.kind !== 'slug').length;
}
const freezables = () => level.plats.filter(pl => pl.freezable);
function freezablePlatUnder(e) {
  for (const pl of level.plats) if (pl.freezable && Math.abs(pl.y - e.y) < 0.5 && overlapX(e, pl) >= e.w / 2) return pl;
  return null;
}
function poofSlug(e, scored, p) {
  e.state = 'poof';
  for (let k = 0; k < 10; k++) particles.push({ x: e.x, y: e.y - 4, vx: Math.random() * 2.4 - 1.2, vy: -Math.random() * 1.8,
    life: 16 + Math.random() * 12, color: k % 2 ? '#e8fbff' : '#7fd0f0' });
  if (scored) { addScore(500, e.x, e.y - 10, p); sfx.slugPop(); }
}
let slugClock = 0, nextSlug = 0, slugSide = 1;
function updateSlugSpawns() {
  if (bonus || clearT > 0 || hazardsOff || phase < TUNE.slugFrom) return;
  slugClock++;
  if (slugClock < nextSlug) return;
  nextSlug = slugClock + TUNE.slugEvery * 60;
  const out = enemies.filter(e => e.kind === 'slug' && e.state !== 'poof').length + spawnQueue.filter(q => q.kind === 'slug').length;
  if (out >= TUNE.slugMax || freezables().every(pl => pl.iced) || targetsLeft(true) === 0) return;   // arcade: none once all 3 are iced
  slugSide = -slugSide;
  spawnCritter('slug', slugSide, 0);
}

function updateEnemies() {
  if (targetsLeft(true) === 1) {                   // last critter goes furious
    const last = enemies.find(e => e.state !== 'kicked' && e.kind !== 'slug' && e.state !== 'poof');
    if (last && last.kind !== 'gnat' && last.level < 2) { last.level = 2; if (last.state === 'walk') sfx.wake(); }   // arcade: except flies
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.state === 'kicked') {
      e.vy += 0.2; e.x += e.vx; e.y += e.vy;
      if (e.y - e.h > H + 8) enemies.splice(i, 1);
      continue;
    }
    if (e.state === 'poof') { enemies.splice(i, 1); continue; }
    if (e.turnCool > 0) e.turnCool--;

    if (e.kind === 'slug') {
      if (e.state === 'freezing') {                  // parked at the center, icing the girder
        e.anim += 0.3;
        if (--e.freezeT <= 0) {
          const pl = e.freezePl;
          if (pl && !pl.iced) { pl.iced = true; pl.iceT = 0; sfx.freeze(); }
          poofSlug(e, false); enemies.splice(i, 1);
        }
        continue;
      }
      if (e.onGround) {
        e.vx = e.dir * TUNE.slugSpeed; e.anim += 0.08;
        const pl = freezablePlatUnder(e);
        if (pl && !pl.iced && Math.abs(wrapDx(pl.x + pl.w / 2, e.x)) <= TUNE.slugSpeed + 0.01) {
          e.state = 'freezing'; e.freezeT = TUNE.slugFreezeTime; e.freezePl = pl; e.x = pl.x + pl.w / 2; e.vx = 0;
          sfx.slugWork();
          continue;
        }
      }
    } else if (e.state === 'walk' && e.kind === 'gnat') {
      const toPipe = Math.abs(e.y - FLOOR_Y) < 0.5 && ((e.dir < 0 && e.x < 56) || (e.dir > 0 && e.x > W - 56));
      if (e.onGround && toPipe) {                    // crawl the last stretch into the bottom pipe
        e.vx = e.dir * critterSpeed(e) * 0.8;
      } else if (e.onGround) {                       // rest on the girder, then hop
        e.vx = 0;
        if (--e.hopT <= 0) {
          e.vy = -TUNE.gnatHopVy; e.onGround = false; e.vx = e.dir * critterSpeed(e);
          e.hopT = TUNE.gnatWait[e.level];
          sfx.hop();
        }
      }
      e.anim += e.onGround ? 0 : 0.5;              // wings buzz only in the air
    } else if (e.state === 'walk') {
      if (e.onGround) { e.vx = e.dir * critterSpeed(e); e.anim += critterSpeed(e) * 0.12; }
    } else {
      if (e.onGround) e.vx *= 0.85;
      e.anim += 0.15;
      if (--e.flipT <= 0) {                        // wakes up angrier
        e.state = 'walk'; e.angry = false;
        e.level = Math.min(2, e.level + 1);
        e.onGround = false; e.vy = -1.5;
        sfx.wake();
      }
    }

    e.x += e.vx;

    if (!e.onGround && e.y > FLOOR_Y - 30) e.x = clamp(e.x, 12, W - 12);   // no wrapping over the bottom pipes
    const nearFloor = e.onGround && Math.abs(e.y - FLOOR_Y) < 0.5;
    if (e.state === 'walk' && nearFloor &&
        ((e.dir < 0 && e.x < 10) || (e.dir > 0 && e.x > W - 10))) {
      // Same critter, same mood: color level AND anger survive the trip through the pipes
      spawnQueue.push({ kind: e.kind, side: e.dir, delay: TUNE.pipeReturn, level: e.level, angry: e.angry });
      enemies.splice(i, 1);
      maybeEarlyRed();
      continue;
    }
    e.x = wrapX(e.x);
    fallAndLand(e, e.w / 2, e.kind === 'gnat' && e.state === 'walk' ? TUNE.gnatGrav : 0.2);
  }

  // Any walking critter that runs into another critter (walking OR flipped) turns around.
  for (let a = 0; a < enemies.length; a++) for (let b = a + 1; b < enemies.length; b++) {
    const A = enemies[a], B = enemies[b];
    if (A.state === 'kicked' || B.state === 'kicked' || A.state === 'poof' || B.state === 'poof' || !A.onGround || !B.onGround) continue;
    if (Math.abs(A.y - B.y) > 1) continue;
    const dx = wrapDx(A.x, B.x);
    if (dx === 0 || Math.abs(dx) >= (A.w + B.w) / 2) continue;
    const aInto = A.state === 'walk' && !A.turnCool && Math.sign(dx) === A.dir;
    const bInto = B.state === 'walk' && !B.turnCool && Math.sign(dx) === -B.dir;
    if (aInto) { A.dir *= -1; A.turnCool = 20; }
    if (bInto) { B.dir *= -1; B.turnCool = 20; }
  }
}

function fallAndLand(e, min, grav) {
  if (e.onGround) {
    if (!supported(e, min)) { e.onGround = false; e.vy = 0; }
  } else {
    e.vy = Math.min(e.vy + grav, 4);
    const oldBot = e.y;
    e.y += e.vy;
    if (e.vy >= 0) {
      const land = findLanding(e, oldBot, min);
      if (land) { e.y = land.y; e.vy = 0; e.onGround = true; }
    }
  }
}

// A critter whose center is still inside a pipe (spawning at the top or exiting at the bottom)
// is out of play: it can't hurt the worker and can't be bumped.
function inPipe(e) {
  if (Math.abs(e.y - TOP_Y) < 0.5 && (e.x < 26 || e.x > W - 26)) return true;
  if (e.y > FLOOR_Y - 12 && (e.x < 22 || e.x > W - 22)) return true;
  return false;
}

// ---------- Sparks (fireballs) ----------
// RED: appears by a top pipe (from Phase 1), drifts slowly on diagonals, bouncing off girders and the
//      screen edges (never wraps). Can also show up early when a critter drains into a bottom pipe.
// GREEN: appears at a side edge in line with the worker's level (from Phase 4), crosses that level with
//      two small hops and one long hop, and vanishes at the far edge.
// Never phase targets. Max 2 of each. Snuff one by bumping the girder just as it touches down.
const sparks = [];
let sparkClock = 0, sparkSide = 1, nextRed = 0, nextGreen = 0, redCount = 0, greenCount = 0;
const SPARK_LANES = [56, 104, 152, 200];
const GREEN_HOPS = [[22, 3], [22, 3], [44, 8]];     // [frames, height] — two small, one long
function sparkGapFrames(base, n) {
  const hot = sparksHot(phase) ? 0.6 : 1;
  return Math.round(Math.max(TUNE.sparkMinGap, base - TUNE.sparkSpeedUp * n) * hot * 60);
}
function resetSparkTimers() {
  sparks.length = 0; sparkClock = 0; redCount = 0; greenCount = 0;
  const hot = sparksHot(phase) ? 0.6 : 1;
  nextRed = Math.round(TUNE.sparkRedFirst * hot * 60);
  nextGreen = Math.round(TUNE.sparkGreenFirst * hot * 60);
}
function sparkCount(kind) { return sparks.filter(s => s.kind === kind).length; }
function spawnSpark(kind) {
  if (sparkCount(kind) >= TUNE.sparkMaxEach) return;
  sparkSide = -sparkSide;
  if (kind === 'red') {
    const left = sparkSide < 0;
    sparks.push({ kind, x: left ? 34 : W - 34, y: TOP_Y - 14, vx: (left ? 1 : -1) * 0.55, vy: 0.55,
                  age: 0, life: TUNE.sparkRedLife * 60, seed: Math.random() * 6 });
    redCount++;
  } else {
    // the worker's level: the girder he stands on, or the next one below him (2P: one of the two, at random)
    const live = alivePlayers(), t = live.length > 1 ? live[Math.floor(Math.random() * live.length)] : live[0];
    const lane = (t && SPARK_LANES.find(y => y >= t.y - 0.5)) || FLOOR_Y;
    const left = sparkSide < 0;
    sparks.push({ kind, x: left ? -6 : W + 6, y: lane - 4, baseY: lane - 4, vx: (left ? 1 : -1) * 0.95,
                  vy: 0, age: 0, hop: 0, hopT: 0, life: 99999, seed: Math.random() * 6 });
    greenCount++;
  }
  sfx.sparkIn();
}
function sparkHitsPlat(s) {
  for (const pl of level.plats) {
    if (pl.temp) continue;
    if (s.x + 3 > pl.x && s.x - 3 < pl.x + pl.w && s.y + 3 > pl.y && s.y - 3 < pl.y + pl.h) return true;
  }
  return false;
}
// Called when a critter drains into a bottom pipe
function maybeEarlyRed() {
  if (phase >= TUNE.sparkRedFrom && !bonus && sparkClock >= TUNE.sparkRedEarly * 60 && redCount === 0) {
    spawnSpark('red');
    nextRed = sparkClock + sparkGapFrames(TUNE.sparkRedEvery, redCount);
  }
}
function updateSparks() {
  if (bonus || clearT > 0 || hazardsOff) return;
  sparkClock++;
  if (phase >= TUNE.sparkRedFrom && sparkClock >= nextRed) {
    spawnSpark('red'); nextRed = sparkClock + sparkGapFrames(TUNE.sparkRedEvery, redCount);
  }
  if (phase >= TUNE.sparkGreenFrom && sparkClock >= nextGreen) {
    spawnSpark('green'); nextGreen = sparkClock + sparkGapFrames(TUNE.sparkGreenEvery, greenCount);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.age++;
    if (s.kind === 'green') {
      s.x += s.vx;
      const [len, ht] = GREEN_HOPS[s.hop];
      s.y = s.baseY - Math.sin(Math.PI * s.hopT / len) * ht;
      if (++s.hopT >= len) { s.hopT = 0; s.hop = (s.hop + 1) % GREEN_HOPS.length; }
      if ((s.x < -10 || s.x > W + 10) && s.age > 30) { sparks.splice(i, 1); continue; }
    } else {
      s.x += s.vx;
      if (sparkHitsPlat(s) || s.x < 4 || s.x > W - 4) { s.x -= s.vx; s.vx = -s.vx; }
      s.y += s.vy;
      if (sparkHitsPlat(s) || s.y < 22) { s.y -= s.vy; s.vy = -s.vy; s.landed = 6; }
      if (s.landed > 0) s.landed--;
      if (s.age > s.life) { sparks.splice(i, 1); continue; }
    }
    for (const p of alivePlayers()) {
      if (p.invuln <= 0 && Math.abs(p.x - s.x) < 7 && s.y + 3 > p.y - p.h + 2 && s.y - 3 < p.y - 1) {
        if (killPlayer(p, 'spark')) return;             // last worker standing: all sparks gone
      }
    }
  }
}
// Bump snuffs a spark only while it's touching down on that girder
function snuffSparks(pl, x, p) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    const bottom = s.y + 3;
    const touching = s.kind === 'red' ? (bottom >= pl.y - 3 && bottom <= pl.y + 1) : (bottom >= pl.y - 3 && bottom <= pl.y + 1);
    if (Math.abs(x - s.x) < 14 && touching) {
      sparks.splice(i, 1);
      addScore(s.kind === 'red' ? 1000 : 200, s.x, s.y - 8, p);
      sfx.sparkOut();
      for (let k = 0; k < 8; k++) particles.push({ x: s.x, y: s.y, vx: Math.random() * 2 - 1, vy: -Math.random() * 1.6,
        life: 14 + Math.random() * 10, color: s.kind === 'red' ? '#ffb040' : '#9dff8a' });
    }
  }
}

// ---------- Icicles (from Phase 16): grow under the top girders + pipes, wobble, drop, shatter ----------
const icicles = [];
let icicleClock = 0, nextIcicle = 0;
function spawnIcicle() {
  const spots = [];
  for (const pl of level.plats) if (pl.y === TOP_Y && !pl.floor) for (let x = pl.x + 10; x <= pl.x + pl.w - 10; x += 6) spots.push([x, TOP_Y + 8]);
  spots.push([12, 57], [W - 12, 57], [12, 57], [W - 12, 57]);                       // under the top pipes too
  const free = spots.filter(([x]) => !icicles.some(ic => Math.abs(ic.x - x) < 12));
  if (!free.length) return;
  const [x, y] = free[Math.floor(Math.random() * free.length)];
  icicles.push({ x, y, len: 0, state: 'grow', t: 0, vy: 0 });
}
function updateIcicles() {
  if (bonus || clearT > 0 || hazardsOff || phase < TUNE.icicleFrom) return;
  icicleClock++;
  if (icicleClock >= nextIcicle) {
    nextIcicle = icicleClock + TUNE.icicleEvery * 60;
    if (icicles.filter(ic => ic.state !== 'fall').length < TUNE.icicleMax) spawnIcicle();
  }
  for (let i = icicles.length - 1; i >= 0; i--) {
    const ic = icicles[i];
    ic.t++;
    if (ic.state === 'grow') { ic.len = Math.min(7, ic.t / 150 * 7); if (ic.t >= 150) { ic.state = 'shake'; ic.t = 0; sfx.creak(); } }
    else if (ic.state === 'shake') { if (ic.t >= 50) { ic.state = 'fall'; ic.t = 0; sfx.icefall(); } }
    else {
      ic.vy = Math.min(ic.vy + 0.18, 4); ic.y += ic.vy;
      if (ic.y + ic.len >= FLOOR_Y) {
        for (let k = 0; k < 9; k++) particles.push({ x: ic.x, y: FLOOR_Y - 1, vx: Math.random() * 2.6 - 1.3, vy: -Math.random() * 1.6,
          life: 14 + Math.random() * 10, color: k % 2 ? '#e8fbff' : '#a8e4f8' });
        sfx.shatter(); icicles.splice(i, 1); continue;
      }
      const p = alivePlayers().find(p => p.invuln <= 0 && Math.abs(p.x - ic.x) < 4.5 && ic.y + ic.len > p.y - p.h + 1 && ic.y < p.y - 1);
      if (p) {
        icicles.splice(i, 1);
        if (killPlayer(p)) return;
      }
    }
  }
}

function checkPlayerEnemies() {
  for (const p of alivePlayers()) {
    for (const e of enemies) {
      if (e.state === 'kicked' || e.state === 'poof' || inPipe(e) || !touching(p, e, 2)) continue;
      if (e.state === 'flipped') kickCritter(e, p);
      else if (p.invuln <= 0) { killPlayer(p); break; }
    }
  }
}

// ---------- Coins ----------
function spawnCoin() {
  coinSide = -coinSide;
  coins.push({ x: coinSide < 0 ? 8 : W - 8, y: TOP_Y, w: 8, h: 8, vx: 0, vy: 0,
               dir: coinSide < 0 ? 1 : -1, onGround: true, spin: 0, fixed: false });
}
function collectCoin(i, p) {
  const c = coins[i];
  coins.splice(i, 1);
  addScore(800, c.x, c.y - 10, p);
  sfx.coin();
  for (let k = 0; k < 6; k++) {
    particles.push({ x: c.x, y: c.y - 4, vx: Math.random() * 2 - 1, vy: -Math.random() * 1.5,
                     life: 18 + Math.random() * 8, color: C.coin });
  }
  if (bonus) bonus.got++;
}
function updateCoins() {
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.spin += 0.15;
    if (!c.fixed) {
      if (c.onGround) c.vx = c.dir * TUNE.coinSpeed;
      c.x += c.vx;
      if (c.onGround && Math.abs(c.y - FLOOR_Y) < 0.5 &&
          ((c.dir < 0 && c.x < 10) || (c.dir > 0 && c.x > W - 10))) { coins.splice(i, 1); continue; }
      c.x = wrapX(c.x);
      fallAndLand(c, 4, 0.2);
    }
    const p = alivePlayers().find(p => touching(p, c, 1));
    if (p) collectCoin(i, p);
  }
}

// ---------- Bumps, Jolt, fx ----------
function triggerBump(pl, x, by) {                  // by = the worker whose head hit the girder
  bumps.push({ pl, x, t: 0 });
  sfx.bump();
  snuffSparks(pl, x, by);
  for (const q of alivePlayers()) {                 // 2P: bumping under the other worker dazes him
    if (q === by || !q.onGround || Math.abs(q.y - pl.y) > 0.5 || overlapX(q, pl) <= 0) continue;
    if (Math.abs(wrapDx(x, q.x)) < TUNE.bumpReach) stunPlayer(q, x);
  }
  for (let i = 0; i < 4; i++) {
    particles.push({ x: x + (Math.random() * 8 - 4), y: pl.y + pl.h, vx: Math.random() * 1.2 - 0.6,
                     vy: Math.random() * 0.6, life: 24 + Math.random() * 10 });
  }
  for (const e of enemies) {
    if (e.state === 'kicked' || !e.onGround) continue;
    if (Math.abs(e.y - pl.y) > 0.5 || overlapX(e, pl) <= 0) continue;
    if (Math.abs(wrapDx(x, e.x)) < TUNE.bumpReach && !inPipe(e)) hitCritter(e, x, by);
  }
  for (let i = coins.length - 1; i >= 0; i--) {    // bumping under a coin collects it
    const c = coins[i];
    if (Math.abs(c.y - pl.y) < 0.5 && overlapX(c, pl) > 0 && Math.abs(wrapDx(x, c.x)) < TUNE.bumpReach) collectCoin(i, by);
  }
}
function triggerJolt(p) {
  shakeT = 20; jolt.flash = 10;
  sfx.jolt();
  for (const e of enemies) if (e.state !== 'kicked' && e.onGround && !inPipe(e)) hitCritter(e, e.x - e.dir, p);
  for (let i = coins.length - 1; i >= 0; i--) if (!coins[i].fixed && coins[i].onGround) collectCoin(i, p);
  setJoltHits(jolt.hits - 1);
}
function addScore(n, x, y, p) {                   // p = the worker who earned it
  p.score += n;
  if (x !== undefined) popups.push({ x, y, text: String(n), life: 50 });
  if (!p.extraGiven && p.score >= TUNE.extraLifeAt) {
    p.extraGiven = true; p.lives++;
    popups.push({ x: p.x, y: p.y - 20, text: '1UP', life: 80 });
    sfx.oneup();
  }
}
function updateFx() {
  for (let i = smoke.length - 1; i >= 0; i--) {
    const q = smoke[i]; q.x += q.vx; q.y += q.vy; q.r += 0.06;
    if (--q.life <= 0) smoke.splice(i, 1);
  }
  if (shakeT > 0) shakeT--;
  for (const pl of level.plats) if (pl.iced && pl.iceT < 1) pl.iceT = Math.min(1, pl.iceT + 1 / 40);
  if (jolt.flash > 0) jolt.flash--;
  for (let i = bumps.length - 1; i >= 0; i--) if (++bumps[i].t >= TUNE.bumpFrames) bumps.splice(i, 1);
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.vy += 0.12; q.x += q.vx; q.y += q.vy;
    if (--q.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y -= 0.4;
    if (--popups[i].life <= 0) popups.splice(i, 1);
  }
}

      for (const p of inPlay()) addScore(prize, undefined, undefined, p);   // 2P: both workers get it
      showBanner('PERFECT!', `+${prize} bonus`, 170);
      sfx.perfect();

        if (anyone()) updateSparks();

        const X = Math.round(x), Y = Math.round(s.y);

function newMailLane(b) { b.baseY = MAIL_LANES[Math.floor(Math.random() * MAIL_LANES.length)]; }
function updateMail() {

    newMailLane(mailBird);

  const b = mailBird;
  if (!b) return;
  b.t++;
  b.x += b.dir * MAIL.speed;
  b.y = b.baseY + Math.sin(b.t * 0.06) * 4;
  if (b.t % 75 === 0) mailSfx.chirp();
  if ((b.dir > 0 && b.x > W + 16) || (b.dir < 0 && b.x < -16)) {   // off the edge: turn back or leave
    if (++b.passes >= MAIL.passes) { mailBird = null; mailAt = -1; return; }
    b.dir = -b.dir; newMailLane(b);

  const p = alivePlayers().find(p => Math.abs(p.x - b.x) < 11 && p.y - p.h < b.y + 11 && p.y > b.y - 5);
  if (p) catchMail(p);

function drawPlayer(p) {
  if (!p.dead && p.invuln > 0 && frameCount % 6 < 3) return;
  if (p.dead && p.deathCause === 'spark') {
    const blink = p.deathT > 40 && p.deathT < 47;
    const jx = p.deathT < 10 ? (frameCount % 2 ? 0.6 : -0.6) : 0;   // jolt of the hit
    if (HD) wrapDraw(p.x + jx, 8, x => drawBurntHD(x, p.y, p.face, blink));
    else {
      const s = blink ? SPR.burntBlink : SPR.burnt;
      blitWrap(p.face > 0 ? s.r : s.l, Math.round(p.x + jx - s.w / 2), Math.round(p.y - s.h), s.w);
    }
    return;
  }
  if (HD) {
    const walking = p.onGround && Math.abs(p.vx) > 0.05;
    const swing = p.skid ? 0.55 : walking ? Math.sin(p.anim * Math.PI) * 0.65 : 0;
    const air = !p.onGround && !p.dead;
    const armUp = air && p.vy < 1.5;
    wrapDraw(p.x, 7, x => {
      ctx.save(); ctx.translate(x, p.y);
      if (p.dead && p.deathT > 45) { ctx.translate(0, -8); ctx.scale(1, -1); ctx.translate(0, 8); }
      workerHD(p.face, swing, air, armUp, WORKER_PALS[p.id]);
      ctx.restore();
    });
    drawDazed(p);
    return;
  }
  const SP = p.id ? SPR2 : SPR;
  let s, img;
  if (p.dead) {
    s = SP.stand;
    img = p.deathT > 45 ? (p.face > 0 ? s.fr : s.fl) : (p.face > 0 ? s.r : s.l);
  } else {
    if (!p.onGround) s = SP.jump;
    else if (p.skid) s = SP.walkA;
    else if (Math.abs(p.vx) < 0.05) s = SP.stand;
    else s = (Math.floor(p.anim) & 1) ? SP.walkB : SP.walkA;
    img = p.face > 0 ? s.r : s.l;
  }
  blitWrap(img, Math.round(p.x - s.w / 2), Math.round(p.y - s.h), s.w);
  drawDazed(p);
}

function drawDazed(p) {

// CARTOON CRITTERS (HD mode) — Bernie's picks: Chunky Buddy turtle, Bug-Eye crab, Buzzy fly.
// Thick dark outlines, big eyes, flat bright colors + simple shine. Origin = feet center, facing +x.

const TOON = (() => {
  const OUT = '#1c1422', TAU = Math.PI * 2;
  const rr = (c, x, y, w, h, r) => { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

  const E = (c, x, y, rx, ry, fill, lw = 0.9, rot = 0) => shape(c, () => c.ellipse(x, y, rx, ry, rot, 0, TAU), fill, lw);
  function line(c, p, w, col = OUT) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]);
    c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }
  const dot = (c, x, y, r, col) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = col; c.fill(); };

  const shine = (c, x, y, rx, ry, a = 0.45) => { c.beginPath(); c.ellipse(x, y, rx, ry, -0.3, 0, TAU); c.fillStyle = `rgba(255,255,255,${a})`; c.fill(); };
  // eye: normal (pupil looking px,py), 'dizzy' (X marks when flipped), 'mad' (red-rimmed, small pupil)
  function eye(c, x, y, r, px, py, mode = 'normal', tall = 1.1) {
    E(c, x, y, r, r * tall, mode === 'mad' ? '#ffe0e0' : '#ffffff', 0.7);

    E(c, 3.2 - Math.sin(legPh) * 0.5, -0.9 - lift(1), 1.7, 1.0, skin);                 // front foot
    // neck: long and craning up while walking; pulled in when flipped

    const neck = upside ? [4.6, -3.0, 6.6, -4.6] : [4.4, -2.8, 7.9, -3.4, 8.6, -8.0 + bob];

    neckPath(); c.lineWidth = 2.2; c.strokeStyle = skin; c.stroke();
    // shell (covers the base of the neck)
    shape(c, () => { c.ellipse(-0.6, -3.0, 7.0, 6.0, 0, Math.PI, TAU); c.closePath(); }, pal.s);

      c.save(); c.rotate(-snap);                                                         // claw notch opens wider when mad

      c.restore(); c.restore();
    }
    E(c, 0, -3.8, 6.4, 3.4, pal.s);                                                      // body
    for (const s of [-1, 1]) {
      line(c, [s * 1.6, -6.4, s * 2.2, -9.6], 0.9);
      eye(c, s * 2.3, -10.6, 1.6, s * -0.2, angry ? 0.35 : 0.2, upside ? 'dizzy' : angry ? 'mad' : 'normal');
      if (angry && !upside) line(c, [s * 0.9, -12.9, s * 3.6, -11.9], 0.75);           // furious brows
    }
    shape(c, () => rr(c, -2.2, -3.6, 4.4, 1.6, 0.6), '#ffffff', 0.55);                   // toothy grin...
    for (const x of [-1.1, 0, 1.1]) line(c, [x, -3.6, x, -2.0], 0.3);
    if (angry) line(c, [-2.2, -2.8, 2.2, -2.8], 0.35);                                   // ...clenched when mad
    shine(c, -2.6, -5.6, 1.8, 0.6);
    c.restore();
  }

  // ---------- Fly: "Buzzy" ----------
  function fly(c, pal, upside, flap, legPh) {
    c.save(); if (upside) flipAbout(c, -6.2);
    for (let i = 0; i < 3; i++) { const k = Math.sin(legPh + i * 1.7) * 0.5;
      limb(c, [-1.4 + i * 1.4, -2.6, -1.8 + i * 1.4 + k, -1.0, -1.3 + i * 1.4 + k, 0], 0.5, '#c8c8d0'); }
    for (const w of [0, 1]) { c.save(); c.translate(-0.8 + w * 1.4, -7.2); c.rotate(-0.4 - flap + w * 0.4);
      E(c, 0, -2.4, 1.5, 2.8, 'rgba(225,245,255,0.75)', 0.6); c.restore(); }
    E(c, 0, -4.8, 4.2, 3.6, pal.s);                                                      // round body
    c.save(); c.beginPath(); c.ellipse(0, -4.8, 4.2, 3.6, 0, 0, TAU); c.clip();
    for (const x of [-2.4, -0.6]) { c.fillStyle = pal.d; c.fillRect(x, -9, 0.8, 9); } c.restore();   // stripes
    for (let a = 0; a < TAU; a += 0.5) line(c, [Math.cos(a) * 4.3, -4.8 + Math.sin(a) * 3.7, Math.cos(a) * 4.9, -4.8 + Math.sin(a) * 4.2], 0.35);   // fuzz

  }

})();
