  ell(-2.6, -3.6, 1.6, 0.5, 'rgba(255,255,255,0.5)');                              // shine
}
function drawFreezeAura(e) {                                         // both modes: pulsing frost glow + orbiting sparkles
  const p = 0.5 + 0.5 * Math.sin(frameCount * 0.4);
  ctx.beginPath(); ctx.ellipse(e.x, e.y - 3.5, 8 + p * 2, 4.8 + p, 0, 0, Math.PI * 2);           // crisp frost ring
  ctx.lineWidth = 0.6; ctx.strokeStyle = `rgba(200,245,255,${0.45 + 0.4 * p})`; ctx.stroke();
  for (let k = 0; k < 4; k++) { const a = frameCount * 0.15 + k * Math.PI / 2;
    R(Math.round(e.x + Math.cos(a) * 9), Math.round(e.y - 4 + Math.sin(a) * 4), 1, 1, '#ffffff'); }
}
function drawEnemies() {
  for (const e of enemies) {
    if (e.state === 'poof') continue;
    if (e.kind === 'slug' && e.state === 'freezing') drawFreezeAura(e);
    if (HD && e.kind === 'slug') {
      wrapDraw(e.x + (e.state === 'freezing' ? Math.sin(frameCount * 1.5) * 0.4 : 0), 8, x => {
        ctx.save(); ctx.translate(x, e.y); ctx.scale(e.dir, 1); slugHD(e.anim * 2, e.state === 'freezing'); ctx.restore(); });
      continue;
    }
    if (HD) {
      const upside = e.state !== 'walk';
      let dx = 0;
      if (e.state === 'flipped' && e.flipT < 90 && frameCount % 4 < 2) dx = 0.8;
      if (e.kind === 'pinc' && e.angry && e.state === 'walk') dx = Math.sin(frameCount * 1.3) * 0.6;
      wrapDraw(e.x + dx, 11, x => {
        ctx.save(); ctx.translate(x, e.y);
        if (e.kind === 'gnat') {
          ctx.scale(e.dir * TUNE.flyScale, TUNE.flyScale);
          const flap = !upside && !e.onGround ? Math.sin(frameCount * 1.4) * 0.9 : 0.15;
          TOON.fly(ctx, TOON_FLY[e.level], upside, flap, upside ? frameCount * 0.6 : 0);
        } else if (e.kind === 'snap') {
          ctx.scale(e.dir, 1);
          const ph = upside ? frameCount * 0.5 : (e.onGround ? e.anim * Math.PI : 0);
          TOON.turtle(ctx, TOON_TURTLE[e.level], upside, ph);
        } else {
          ctx.scale(e.dir, 1);
          const ph = upside ? frameCount * 0.6 : e.anim * Math.PI;
          TOON.crab(ctx, TOON_CRAB[e.level], e.angry && e.state === 'walk', upside, ph);
        }
        ctx.restore();
      });
      continue;
    }
    const set = ESPR[e.kind === 'pinc' && e.angry ? 'pincMad' : e.kind][e.level];
    const legs = e.kind === 'gnat'
      ? (e.state === 'walk' ? (!e.onGround ? (frameCount >> 2) & 1 : 0) : (frameCount >> 3) & 1)   // wings flap in the air
      : (e.state === 'walk' && !e.onGround) ? 0 : Math.floor(e.anim) & 1;
    const s = legs ? set.b : set.a;
    const upside = e.state !== 'walk' && e.kind !== 'slug';
    const img = upside ? (e.dir > 0 ? s.fr : s.fl) : (e.dir > 0 ? s.r : s.l);
    let x0 = Math.round(e.x - s.w / 2);
    if (e.state === 'flipped' && e.flipT < 90 && frameCount % 4 < 2) x0 += 1;
    if (e.kind === 'pinc' && e.angry && e.state === 'walk' && frameCount % 6 < 3) x0 += (frameCount % 12 < 6 ? 1 : -1);
    if (e.kind === 'gnat') {                                   // pixel fly drawn at 20x12 to match its bigger hitbox
      const gx = Math.round(e.x - 10) + (x0 - Math.round(e.x - s.w / 2)), gy = Math.round(e.y - 12);
      for (const off of [0, -W, W]) if (gx + off > -20 && gx + off < W + 20) ctx.drawImage(img, gx + off, gy, 20, 12);
      continue;
    }
    blitWrap(img, x0, Math.round(e.y - s.h), s.w);
  }
}
function drawCoins() {
  for (const c of coins) {
    if (HD) { wrapDraw(c.x, 4, x => { ctx.save(); ctx.translate(x, c.y); coinHD(c.spin); ctx.restore(); }); continue; }
    const f = Math.floor(c.spin) % 4;
    const cw = [6, 4, 2, 4][f];
    const x = Math.round(c.x), y = Math.round(c.y - 8);
    for (const off of [0, -W, W]) {
      const cx = x + off;
      if (cx < -8 || cx > W + 8) continue;
      ctx.fillStyle = C.coinLo; ctx.fillRect(cx - cw / 2, y + 1, cw, 6);
      ctx.fillRect(cx - cw / 2 + (cw > 2 ? 1 : 0), y, Math.max(1, cw - 2), 8);
      ctx.fillStyle = C.coin;
      if (cw > 2) { ctx.fillRect(cx - cw / 2 + 1, y + 1, cw - 2, 6); }
      ctx.fillStyle = C.coinHi;
      if (cw >= 4) ctx.fillRect(cx - cw / 2 + 1, y + 2, 1, 3);
    }
  }
}
function drawSmoke() {
  for (const q of smoke) {
    const a = 0.55 * (q.life / q.max);
    if (HD) ell(q.x, q.y, q.r, q.r, `rgba(90,86,82,${a})`);
    else { ctx.fillStyle = `rgba(90,86,82,${a})`; const r = Math.round(q.r); ctx.fillRect(Math.round(q.x - r), Math.round(q.y - r), r * 2, r * 2); }
  }
}
function drawParticles() {
  drawSmoke();
  for (const q of particles) {
    ctx.fillStyle = q.color || currentTheme().hi;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
  }
}
const FONT = 'bold 8px ui-monospace, Menlo, Consolas, monospace';
function drawPopups() {
  ctx.font = 'bold 6px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of popups) {
    ctx.fillStyle = q.text === '10' ? '#ffffff' : q.text === '1UP' ? '#7dff9a' : PAL.Y;
    ctx.fillText(q.text, Math.round(q.x), Math.round(q.y));
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}
const pad6 = n => String(n).padStart(6, '0');
function drawHUD() {
  ctx.font = FONT; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  const [p1, p2] = players, two = state === 'title' ? twoP : p2.inGame;
  ctx.fillStyle = C.hudP1; ctx.fillText('I', 10, 3);
  ctx.fillStyle = C.hud;   ctx.fillText(pad6(p1.score), 20, 3);
  if (two) {                                       // 2P: Player 2's score top right; phase moves under TOP
    ctx.fillStyle = C.hudP2; ctx.fillText('II', 196, 3);
    ctx.fillStyle = C.hud;   ctx.fillText(pad6(p2.score), 210, 3);
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = C.hudTop; ctx.fillText('TOP ' + pad6(Math.max(topScore, hiScore())), W / 2, 3);
  if (state !== 'title') {
    ctx.fillStyle = C.girderHi;
    if (!two) { ctx.textAlign = 'right'; ctx.fillText('P' + phase, W - 10, 3); }
    else if (!(bonus && bonus.t > 0)) ctx.fillText('PHASE ' + phase, W / 2, 13);
  }
  if (bonus && bonus.t > 0) {
    const secs = Math.ceil(Math.max(0, bonus.t - 60) / 60);
    ctx.textAlign = 'center';
    ctx.fillStyle = secs <= 5 && frameCount % 20 < 10 ? C.hudTop : C.coin;
    ctx.fillText(`TIME ${String(secs).padStart(2, '0')}   COINS ${bonus.got}/${bonus.total}`, W / 2, 13);
  }
  ctx.textAlign = 'left';
  const hats = (p, x0, max, pal) => {              // spare lives as little hard hats
    if (state !== 'title' && p.out) { ctx.font = 'bold 6px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#888'; ctx.fillText('OUT', x0, 11); ctx.font = FONT; return; }
    for (let i = 0; i < Math.min(p.lives - 1, max); i++) {
      const x = x0 + i * 8;
      ctx.fillStyle = pal.O; ctx.fillRect(x + 1, 12, 4, 2);
      ctx.fillStyle = pal.o; ctx.fillRect(x, 14, 7, 1);
    }
  };
  hats(p1, 20, 6, WPAL);
  if (two) hats(p2, 210, 5, WPAL2);
  ctx.textAlign = 'right'; ctx.fillStyle = '#444';
  ctx.fillText('v' + VERSION, W - 4, H - 10);
  ctx.textAlign = 'left';
}
function drawBanner() {
  if (banner <= 0) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = C.hud; ctx.fillText(bannerLines[0], W / 2, 120);
  ctx.font = FONT; ctx.fillStyle = PAL.Y;
  ctx.fillText(bannerLines[1], W / 2, 132);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}
function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 26px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = PAL.o; ctx.fillText('PIPEWORKS', W / 2 + 2, 52);
  ctx.fillStyle = PAL.O; ctx.fillText('PIPEWORKS', W / 2, 50);
  ctx.font = FONT; ctx.fillStyle = C.girderHi;
  ctx.fillText('Bump the girder. Kick the critter.', W / 2, 74);
  if (HD) {
    const bob = Math.sin(frameCount * 0.08);
    ctx.save(); ctx.translate(W / 2 - (twoP ? 64 : 50), 142); ctx.scale(2.2, 2.2); TOON.turtle(ctx, TOON_TURTLE[0], false, frameCount * 0.12); ctx.restore();
    if (!twoP) { ctx.save(); ctx.translate(W / 2, 142); ctx.scale(2.8, 2.8); workerHD(1, 0, false, false); ctx.restore(); }
    else for (const k of [0, 1]) {                 // 2P: the two workers face each other
      ctx.save(); ctx.translate(W / 2 + (k ? 21 : -21), 142); ctx.scale(2.5, 2.5);
      workerHD(k ? -1 : 1, 0, false, false, WORKER_PALS[k]); ctx.restore();
    }
    ctx.save(); ctx.translate(W / 2 + (twoP ? 66 : 50), 142); ctx.scale(2.0, 2.0); ctx.scale(-1, 1); TOON.crab(ctx, TOON_CRAB[0], false, false, frameCount * 0.12); ctx.restore();
  } else {
    ctx.drawImage(ESPR.snap[0].a.r, W / 2 - 62, 122, 32, 18);
    if (!twoP) ctx.drawImage(SPR.stand.r, W / 2 - 18, 92, 36, 48);
    else { ctx.drawImage(SPR.stand.r, W / 2 - 30, 103, 28, 37); ctx.drawImage(SPR2.stand.l, W / 2 + 2, 103, 28, 37); }
    ctx.drawImage(ESPR.pinc[0].a.l, W / 2 + 30, 120, 32, 20);
  }
  if (Math.floor(frameCount / 30) % 2 === 0) {
    ctx.fillStyle = C.hud;
    ctx.fillText(padActive() ? 'PRESS \u2715 TO START' : isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 160);
  }
  ctx.fillStyle = '#888';
  const help = twoP
    ? (PAD.slot[0] !== null ? 'One game controller per player' : isTouch ? 'P1: touch controls   P2: game controller'
       : 'P1: arrows + Space   P2: A D + W  (or controllers)')
    : padActive() ? 'Stick move  \u2715 jump  \u25A1 players  L1/R1 phase  \u25B3 art' : isTouch ? 'Left thumb: move   Right thumb: jump'
    : 'Arrows / A D to move, Space / Z to jump  (H: art)';
  ctx.fillText(help, W / 2, 177);
  // ART toggle button
  const b = HD_CHIP;
  roundRect(b.x, b.y, b.w, b.h, 3);
  ctx.fillStyle = HD ? 'rgba(255,154,31,0.9)' : 'rgba(134,168,255,0.25)'; ctx.fill();
  ctx.lineWidth = 0.8; ctx.strokeStyle = HD ? '#ffd08a' : 'rgba(134,168,255,0.9)'; ctx.stroke();
  ctx.font = 'bold 7px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = HD ? '#1a0d00' : '#e0e8ff';
  ctx.fillText(HD ? 'ART: HD \u21C4' : 'ART: PIXEL \u21C4', b.x + b.w / 2, b.y + b.h / 2 + 0.4);
  // 1 / 2 PLAYERS toggle
  const pc = PLAYERS_CHIP;
  roundRect(pc.x, pc.y, pc.w, pc.h, 3);
  ctx.fillStyle = twoP ? 'rgba(191,228,255,0.85)' : 'rgba(191,228,255,0.18)'; ctx.fill();
  ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(191,228,255,0.95)'; ctx.stroke();
  ctx.fillStyle = twoP ? '#0a1a2a' : '#e0f0ff';
  ctx.fillText(twoP ? '2 PLAYERS \u21C4' : '1 PLAYER \u21C4', pc.x + pc.w / 2, pc.y + pc.h / 2 + 0.4);
  // DEV start-phase picker
  const q = PHASE_CHIP;
  roundRect(q.x, q.y, q.w, q.h, 3);
  ctx.fillStyle = 'rgba(31,174,158,0.25)'; ctx.fill();
  ctx.lineWidth = 0.8; ctx.strokeStyle = 'rgba(110,230,210,0.9)'; ctx.stroke();
  ctx.fillStyle = '#e0fff8';
  ctx.fillText('\u25C0', q.x + 7, q.y + q.h / 2 + 0.4);
  ctx.fillText('\u25B6', q.x + q.w - 7, q.y + q.h / 2 + 0.4);
  ctx.fillText((isBonus(startPhase) ? 'BONUS ' : 'PHASE ') + startPhase, q.x + q.w / 2, q.y + q.h / 2 + 0.4);
  ctx.font = FONT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 96, W, 44);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 14px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = C.hudTop; ctx.fillText('GAME OVER', W / 2, 112);
  ctx.font = FONT; ctx.fillStyle = C.hud;
  const [p1, p2] = players;
  ctx.fillText(p2.inGame ? `I ${p1.score}   II ${p2.score}   Phase ${phase}` : 'Score ' + p1.score + '   Phase ' + phase, W / 2, 128);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}
function drawDebug() {
  const p = players[0];
  ctx.strokeStyle = '#0f0'; ctx.lineWidth = 0.5;
  for (const q of inPlay()) ctx.strokeRect(q.x - q.w / 2, q.y - q.h, q.w, q.h);
  ctx.strokeStyle = '#f0f';
  for (const e of enemies) ctx.strokeRect(e.x - e.w / 2, e.y - e.h, e.w, e.h);
  ctx.font = FONT; ctx.fillStyle = '#0f0'; ctx.textAlign = 'left';
  ctx.fillText(`x${p.x.toFixed(1)} y${p.y.toFixed(1)} e${enemies.length} q${spawnQueue.length} c${coins.length}`, 4, H - 10);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawControls() {
  const j = buttons.jump;
  ctx.beginPath(); ctx.arc(j.cx, j.cy, j.r, 0, Math.PI * 2);
  ctx.fillStyle = input.jumpHeld ? 'rgba(255,154,31,0.45)' : 'rgba(255,154,31,0.14)';
  ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,154,31,0.75)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,170,0.9)';
  ctx.font = `bold ${Math.round(j.r * 0.36)}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('JUMP', j.cx, j.cy);

  const st = buttons.stick;
  const bx = st.cx, by = st.cy;
  let kx = 0;
  for (const t of touches.values()) {
    if (t.zone !== 'stick') continue;
    kx = view.tablet ? clamp(t.x - st.cx, -st.travel, st.travel)
                     : clamp((t.x - t.ax) / STICK_PHONE_REACH, -1, 1) * st.travel;   // knob shows logical push
    break;
  }
  const trackH = st.r * 0.62, trackW = st.travel * 2 + trackH;
  roundRect(bx - trackW / 2, by - trackH / 2, trackW, trackH, trackH / 2);
  ctx.fillStyle = 'rgba(134,168,255,0.12)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(134,168,255,0.6)'; ctx.stroke();
  const a = trackH * 0.22;
  ctx.fillStyle = 'rgba(200,215,255,0.5)';
  for (const dir of [-1, 1]) {
    const ax = bx + dir * (trackW / 2 - trackH * 0.35);
    ctx.beginPath();
    ctx.moveTo(ax + dir * a, by); ctx.lineTo(ax - dir * a, by - a * 1.2); ctx.lineTo(ax - dir * a, by + a * 1.2);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(bx + kx, by, st.r * 0.48, 0, Math.PI * 2);
  ctx.fillStyle = (input.left || input.right) ? 'rgba(134,168,255,0.7)' : 'rgba(134,168,255,0.35)';
  ctx.fill(); ctx.strokeStyle = 'rgba(200,215,255,0.9)'; ctx.stroke();
}
function drawRotate() {
  const { cw, ch } = view;
  ctx.fillStyle = PAL.O; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px ui-monospace, Menlo, monospace';
  ctx.fillText('PIPEWORKS', cw / 2, ch / 2 - 30);
  ctx.fillStyle = '#ccc'; ctx.font = '16px ui-monospace, Menlo, monospace';
  ctx.fillText('Rotate to landscape', cw / 2, ch / 2 + 10);
}
function render() {
  const d = view.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  if (view.portrait) { ctx.setTransform(d, 0, 0, d, 0, 0); drawRotate(); return; }

  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.strokeStyle = '#1c1c22'; ctx.lineWidth = 1;
  ctx.strokeRect(view.ox - 0.5, view.oy - 0.5, view.gw + 1, view.gh + 1);

  ctx.setTransform(d * view.sx, 0, 0, d * view.sy, d * view.ox, d * view.oy);
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save();
  if (shakeT > 0) ctx.translate(0, Math.round((Math.random() * 2 - 1) * Math.min(3, shakeT / 5)));
  drawGirders();
  drawJolt();
  drawFloor();
  if (state !== 'title') { drawCoins(); drawEnemies(); }
  drawPipes();                       // critters + coins emerge from inside the pipes...
  if (state !== 'title') { drawPlayers(); drawSparks(); drawIcicles(); drawMailBird(); }   // ...while the worker (and sparks, icicles) are in front
  drawParticles();
  drawPopups();
  ctx.restore();
  drawHUD();
  if (state === 'play') drawBanner();
  if (state === 'gameover') drawGameOver();
  if (state === 'title') drawTitle();
  if (DEBUG) drawDebug();
  ctx.restore();

  if (showTouch()) { ctx.setTransform(d, 0, 0, d, 0, 0); drawControls(); }
}

// ---------- Main loop ----------
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; touches.clear(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
setJoltHits(3);
resize();
requestAnimationFrame(frame);

// Offline support (needs https or localhost; silently skipped elsewhere)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
